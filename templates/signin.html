{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'assets/images/favicon.png' %}" rel="icon" type="image/png">
    <title>Sign In - Social Media</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{% static 'assets/css/icons.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/uikit.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/tailwind.css' %}">

    <style>
        body {
            background: linear-gradient(to right, #000000, #8e44ad);
            font-family: 'Arial', sans-serif;
            color: #f1f1f1;
        }

        .bg-gray-100 {
            background-color: transparent !important; /* Remove default gray background */
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
        }

        .header {
            background-color: rgba(0, 0, 0, 0.7); /* Dark background for header */
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            color: #fff;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #f1f1f1;
            text-shadow: 2px 2px 5px rgba(255, 0, 0, 0.6);
        }

        .btn-pink {
            background-color: #ff4f77;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            color: white;
            transition: background-color 0.3s ease;
        }

        .btn-pink:hover {
            background-color: #e74c3c;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        .login-form input {
            background-color: #222;
            border: 1px solid #666;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            width: 100%;
            color: #f1f1f1;
        }

        .login-form input:focus {
            border-color: #ff4f77;
            outline: none;
            box-shadow: 0 0 8px #ff4f77;
        }

        .login-btn {
            background-color: #ff4f77;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            width: 100%;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease-in-out;
        }

        .login-btn:hover {
            background-color: #e74c3c;
            transform: scale(1.05);
        }

        .footer {
            background-color: #222;
            color: #aaa;
            padding: 20px 0;
            text-align: center;
            font-size: 14px;
        }

        .footer a {
            color: #f1f1f1;
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
            color: #ff4f77;
        }

        h5 {
            color: red;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(255, 0, 0, 0.8);
        }

    </style>

</head>

<body class="bg-gray-100">

    <div id="wrapper" class="wrapper">

        <!-- Header -->
        <div class="header">
            <div class="max-w-6xl mx-auto">
                <div class="flex items-center lg:justify-between justify-around">
                    <a href="trending.html">
                        <h1>Social Media</h1>
                    </a>
                    <div class="flex font-semibold space-x-3 text-center text-sm">
                        <a href="/signup" class="btn-pink">Register</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content -->
        <div>
            <div class="lg:p-12 max-w-md max-w-xl lg:my-0 my-12 mx-auto p-6 space-y-6 login-form">
                <h1 class="lg:text-3xl text-xl font-semibold mb-6"> Log in</h1>

                <div>
                    <style>
                        h5 {
                            color: red;
                        }
                    </style>
                    {% for message in messages %}
                    <h5>{{ message }}</h5>
                    {% endfor %}
                </div>

                <form action="" method="POST">
                    {% csrf_token %}
                    <input type="text" name="username" placeholder="Username" class="bg-gray-200 mb-2 shadow-none dark:bg-gray-800">
                    <input type="password" name="password" placeholder="Password" class="bg-gray-200 mb-2 shadow-none dark:bg-gray-800">
                    <div class="flex justify-between my-4">
                        <div class="checkbox">
                            <input type="checkbox" id="chekcbox1" checked>
                            <label for="chekcbox1"><span class="checkbox-icon"></span>Remember Me</label>
                        </div>
                        <a href="#">Forgot Your Password?</a>
                    </div>
                    <button type="submit" class="login-btn">Login</button>
                    <div class="text-center mt-5 space-x-2">
                        <p class="text-base"> Not registered? <a href="/signup"> Create an account </a></p>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="flex flex-col items-center justify-between lg:flex-row max-w-6xl mx-auto lg:space-y-0 space-y-3">
                <div class="flex space-x-2">
                    <a href="#">About</a>
                    <a href="#">Help</a>
                    <a href="#">Terms</a>
                    <a href="#">Privacy</a>
                </div>
                <p>Design By Om Prakash</p>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="{% static 'assets/js/tippy.all.min.js' %}"></script>
    <script src="{% static 'assets/js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'assets/js/uikit.js' %}"></script>
    <script src="{% static 'assets/js/simplebar.js' %}"></script>
    <script src="{% static 'assets/js/custom.js' %}"></script>

</body>

</html>
